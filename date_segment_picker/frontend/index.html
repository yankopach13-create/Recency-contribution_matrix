<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Период</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 8px 4px;
      color: #31333f;
    }
    .row { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }
    .label { font-weight: 600; margin: 0 0 6px 0; font-size: 0.9rem; }
    input {
      width: 2.5rem;
      padding: 8px 4px;
      text-align: center;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    input.y4 { width: 4rem; }
    .dot { font-size: 1.2rem; user-select: none; }
    button {
      padding: 10px 20px;
      font-size: 1rem;
      cursor: pointer;
      background: #0d2847;
      color: #fff;
      border: none;
      border-radius: 8px;
      margin-top: 4px;
    }
    button:hover:not(:disabled) { background: #164a7d; filter: none; }
    button:disabled {
      background: #ccc;
      color: #666;
      cursor: not-allowed;
    }
    .blocked { font-size: 0.85rem; color: #856404; background: #fff3cd; padding: 8px 10px; border-radius: 6px; margin-top: 8px; max-width: 520px; }
  </style>
</head>
<body>
  <p class="label">Начало периода</p>
  <div class="row">
    <input id="fd" type="text" inputmode="numeric" maxlength="2" placeholder="ДД" autocomplete="off" />
    <span class="dot">.</span>
    <input id="fm" type="text" inputmode="numeric" maxlength="2" placeholder="ММ" autocomplete="off" />
    <span class="dot">.</span>
    <input id="fy" class="y4" type="text" inputmode="numeric" maxlength="4" placeholder="ГГГГ" autocomplete="off" />
  </div>
  <p class="label">Конец периода</p>
  <div class="row">
    <input id="td" type="text" inputmode="numeric" maxlength="2" placeholder="ДД" autocomplete="off" />
    <span class="dot">.</span>
    <input id="tm" type="text" inputmode="numeric" maxlength="2" placeholder="ММ" autocomplete="off" />
    <span class="dot">.</span>
    <input id="ty" class="y4" type="text" inputmode="numeric" maxlength="4" placeholder="ГГГГ" autocomplete="off" />
  </div>
  <button type="button" id="applyBtn">Отобрать период для анализа</button>
  <div id="blockedMsg" class="blocked" style="display:none;"></div>

  <script>
    function send(msg) {
      window.parent.postMessage(Object.assign({ isStreamlitMessage: true }, msg), "*");
    }

    var initialized = false;
    var boundsMeta = { ok: false };

    function frameH() {
      var h = boundsMeta.ok ? 260 : 300;
      var bl = document.getElementById("blockedMsg");
      if (bl && bl.style.display !== "none") h += 48;
      return Math.min(h, 400);
    }

    function signalReady() {
      if (!initialized) {
        initialized = true;
        send({ type: "streamlit:componentReady", apiVersion: 1 });
      }
      send({ type: "streamlit:setFrameHeight", height: frameH() });
    }

    function digits(el, maxLen) {
      el.value = el.value.replace(/\D/g, "").slice(0, maxLen);
    }

    var prevMap = { fm: "fd", fy: "fm", td: "fy", tm: "td", ty: "tm" };

    function chain(id, maxLen, nextId) {
      var el = document.getElementById(id);
      if (!el) return;
      el.addEventListener("input", function () {
        digits(this, maxLen);
        if (this.value.length >= maxLen && nextId) {
          document.getElementById(nextId).focus();
        }
      });
      el.addEventListener("keydown", function (e) {
        if (e.key === "Backspace" && this.value === "" && prevMap[id]) {
          var p = document.getElementById(prevMap[id]);
          if (p) {
            p.focus();
            p.value = p.value.slice(0, -1);
          }
        }
      });
    }

    function pad2(n) { return n < 10 ? "0" + n : String(n); }
    function toIso(y, m, d) {
      return y + "-" + pad2(m) + "-" + pad2(d);
    }

    /** Календарная дата или null (31.02, 35.06 и т.д.) */
    function parseDMY(dd, mm, yyyy) {
      var d = parseInt(dd, 10), m = parseInt(mm, 10), y = parseInt(yyyy, 10);
      if (isNaN(d) || isNaN(m) || isNaN(y)) return null;
      if (y < 1900 || y > 2100 || m < 1 || m > 12 || d < 1) return null;
      var dt = new Date(y, m - 1, d);
      if (dt.getFullYear() !== y || dt.getMonth() !== m - 1 || dt.getDate() !== d) return null;
      return { y: y, m: m, d: d, iso: toIso(y, m, d) };
    }

    function reportValidationError(msg) {
      var fd = document.getElementById("fd").value.trim();
      var fm = document.getElementById("fm").value.trim();
      var fy = document.getElementById("fy").value.trim();
      var td = document.getElementById("td").value.trim();
      var tm = document.getElementById("tm").value.trim();
      var ty = document.getElementById("ty").value.trim();
      send({
        type: "streamlit:setComponentValue",
        value: {
          fd: fd, fm: fm, fy: fy, td: td, tm: tm, ty: ty,
          _nonce: Date.now(),
          _clientValidationError: msg,
        },
      });
    }

    function apply() {
      var btn = document.getElementById("applyBtn");
      if (!boundsMeta.ok || (btn && btn.disabled)) return;

      var fd = document.getElementById("fd").value.trim();
      var fm = document.getElementById("fm").value.trim();
      var fy = document.getElementById("fy").value.trim();
      var td = document.getElementById("td").value.trim();
      var tm = document.getElementById("tm").value.trim();
      var ty = document.getElementById("ty").value.trim();

      if (!fd || !fm || !fy || !td || !tm || !ty) {
        reportValidationError(
          "Заполните все поля (день, месяц, год для начала и конца периода)."
        );
        return;
      }
      if (fy.length !== 4 || ty.length !== 4) {
        reportValidationError("Год укажите четырьмя цифрами.");
        return;
      }

      var a = parseDMY(fd, fm, fy);
      var b = parseDMY(td, tm, ty);
      if (!a) {
        reportValidationError("Начало периода — такой даты в календаре не существует.");
        return;
      }
      if (!b) {
        reportValidationError("Конец периода — такой даты в календаре не существует.");
        return;
      }
      if (a.iso > b.iso) {
        reportValidationError("Начало периода не может быть позже конца.");
        return;
      }

      var cap = boundsMeta.max <= boundsMeta.today ? boundsMeta.max : boundsMeta.today;
      if (a.iso < boundsMeta.min || b.iso > cap) {
        reportValidationError(
          "Период должен быть внутри доступного диапазона base и не позже сегодняшней даты " +
          "(с " + boundsMeta.min.split("-").reverse().join(".") +
          " по " + cap.split("-").reverse().join(".") + ")."
        );
        return;
      }

      send({
        type: "streamlit:setComponentValue",
        value: {
          fd: fd, fm: fm, fy: fy, td: td, tm: tm, ty: ty,
          _nonce: Date.now(),
        },
      });
    }

    chain("fd", 2, "fm");
    chain("fm", 2, "fy");
    chain("fy", 4, "td");
    chain("td", 2, "tm");
    chain("tm", 2, "ty");
    chain("ty", 4, null);

    document.getElementById("ty").addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        apply();
      }
    });

    document.getElementById("applyBtn").addEventListener("click", apply);

    window.addEventListener("message", function (ev) {
      if (!ev.data || ev.data.type !== "streamlit:render") return;
      var args = ev.data.args || {};
      var d = args.prefill || {};
      boundsMeta = args.bounds || { ok: false };
      if (typeof boundsMeta.min === "string") boundsMeta.min = boundsMeta.min.slice(0, 10);
      if (typeof boundsMeta.max === "string") boundsMeta.max = boundsMeta.max.slice(0, 10);
      if (typeof boundsMeta.today === "string") boundsMeta.today = boundsMeta.today.slice(0, 10);

      var blk = document.getElementById("blockedMsg");
      var btn = document.getElementById("applyBtn");
      if (!boundsMeta.ok) {
        if (blk) {
          blk.textContent = boundsMeta.reason || "Сканирование недоступно.";
          blk.style.display = "block";
        }
        if (btn) btn.disabled = true;
      } else {
        if (blk) blk.style.display = "none";
        if (btn) btn.disabled = false;
      }

      ["fd", "fm", "fy", "td", "tm", "ty"].forEach(function (k) {
        var el = document.getElementById(k);
        var v = d[k];
        if (el && v != null && String(v) !== "") el.value = String(v);
      });
      signalReady();
      setTimeout(function () {
        if (boundsMeta.ok) document.getElementById("fd").focus();
      }, 80);
    });

    setTimeout(function () {
      if (!initialized) {
        signalReady();
        if (boundsMeta.ok) document.getElementById("fd").focus();
      }
    }, 600);
  </script>
</body>
</html>
